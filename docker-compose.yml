services:
  race-app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # bind-mount the whole project so the database, races.json, ebl_data/,
      # and generated race pages persist on the host across container
      # restarts/rebuilds, and code edits are picked up without rebuilding
      - .:/app
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      # for the J/80 Race Coach AI reports -- set on the host before
      # `docker compose up` (empty default keeps the app working without it)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
